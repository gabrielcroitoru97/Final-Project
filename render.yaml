databases:
  name: mysite
  datebaseName: mysite
  user: mysite
  plan: free


services:
  - type: web
    name: mysite
    runtime: ruby
    env: ruby
    plan: free
    buildCommand: |
      bundle install
      bundle exec rake assets:precompile
    startCommand: "./bin/render-start.sh"
    envVars:
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mysite
          property: connectionString
        key: RAILS_MASTER_KEY
        sync:false- key:WEB_CONCURRENCY
        value: 2 #sensibledefault
